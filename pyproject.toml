[project]
name = "wikipedia-skill"
version = "0.1.0"
description = "Stateless FastAPI microservice to fetch Wikipedia data, analyze trends (YoY/MoM), and generate PDF reports."
readme = "SKILL.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "jinja2>=3.1.4",
    "playwright>=1.47.0",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
